[versions]
kotlin = "2.4.21"
compose = "1.12.1"
material3 = "1.13.0-alpha02"
# Keep LWJGL pinned; it is intentionally excluded from dependency updates.
lwjgl = "3.4.3"
junit = "6.1.3"
# Material You ("Monet") tonal palettes and dynamic schemes; Kotlin port of Google's material-color-utilities.
material-color-utilities = "5.0.1"

[libraries]
lwjgl = { module = "org.lwjgl:lwjgl", version.ref = "lwjgl" }
lwjgl-sdl = { module = "org.lwjgl:lwjgl-sdl", version.ref = "lwjgl" }
lwjgl-vulkan = { module = "org.lwjgl:lwjgl-vulkan", version.ref = "lwjgl" }
# OpenAL Soft and stb_vorbis for the sound system; both ship natives-linux and natives-windows for 3.4.3.
lwjgl-openal = { module = "org.lwjgl:lwjgl-openal", version.ref = "lwjgl" }
lwjgl-stb = { module = "org.lwjgl:lwjgl-stb", version.ref = "lwjgl" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
material-color-utilities = { module = "com.materialkolor:material-color-utilities", version.ref = "material-color-utilities" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
